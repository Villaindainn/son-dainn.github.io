
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Son's Personal Website</title>

    <style>

        /* Xóa khoảng cách mặc định */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Toàn bộ trang */
        body {
            font-family: Arial, sans-serif;
            color: white;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* Video nền */
        #bg-video {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -2;
        }

        /* Lớp phủ tối */
        .overlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.4);

            z-index: -1;
        }

        /* Nội dung chính */
        .content {
            text-align: center;
            padding: 30px;
        }

        /* Tiêu đề */
        h1 {
            font-size: 50px;
            margin-bottom: 20px;

            text-shadow: 0 0 15px white;
        }

        /* Giới thiệu */
        p {
            font-size: 20px;
            color: #eeeeee;
        }

    </style>

</head>

<body>

    <!-- Video background -->
    <video autoplay muted loop playsinline id="bg-video">

        <source src="background.mp4" type="video/mp4">

    </video>

    <!-- Lớp phủ tối -->
    <div class="overlay"></div>

    <!-- Nội dung website -->
    <div class="content">

        <h1>Welcome to my world</h1>

        <p>This is my personal website.</p>

    </div>

</body>

</html>
