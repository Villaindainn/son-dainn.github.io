
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Son's Personal Website</title>

    <style>

        /* =========================
           1. CÀI ĐẶT CHUNG
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: white;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow-x: hidden;
            overflow-y: auto;
        }


        /* =========================
           2. VIDEO BACKGROUND
        ========================= */

        #bg-video {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: -2;
        }


        /* Lớp phủ tối */

        .overlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.45);

            z-index: -1;
        }


        /* =========================
           3. NỘI DUNG CHÍNH
        ========================= */

        .content {
            width: 100%;
            max-width: 750px;

            text-align: center;

            padding: 40px 20px;

            margin: auto;
        }


        /* Tiêu đề */

        h1 {
            font-size: 50px;

            margin-bottom: 20px;

            text-shadow: 0 0 15px rgba(255,255,255,0.7);
        }


        /* Mô tả */

        .description {
            font-size: 18px;

            color: #eeeeee;

            line-height: 1.6;
        }


        /* =========================
           4. MẠNG XÃ HỘI
        ========================= */

        .socials {
            display: flex;

            justify-content: center;

            gap: 20px;

            margin-top: 30px;
        }


        .socials a {
            color: white;

            text-decoration: none;

            font-size: 16px;

            padding: 12px 25px;

            border: 1px solid rgba(255,255,255,0.5);

            border-radius: 30px;

            background: rgba(255,255,255,0.12);

            backdrop-filter: blur(10px);

            transition: 0.3s;
        }


        .socials a:hover {
            background: white;

            color: black;

            transform: translateY(-4px);
        }


        /* =========================
           5. NÚT FAVORITE MUSIC
        ========================= */

        .music-button {
            margin-top: 30px;

            padding: 14px 30px;

            color: white;

            font-size: 17px;

            background: rgba(255,255,255,0.12);

            border: 1px solid rgba(255,255,255,0.5);

            border-radius: 30px;

            backdrop-filter: blur(10px);

            cursor: pointer;

            transition: 0.3s;
        }


        .music-button:hover {
            background: white;

            color: black;

            transform: translateY(-3px);
        }


        /* =========================
           6. DANH SÁCH NHẠC
        ========================= */

        .music-section {
            display: none;

            width: 100%;

            max-width: 450px;

            margin: 30px auto 0;

            padding: 25px;

            background: rgba(0,0,0,0.55);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255,255,255,0.2);

            border-radius: 20px;
        }


        .music-section h2 {
            font-size: 25px;

            margin-bottom: 20px;
        }


        .song {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            padding: 15px 0;

            border-bottom: 1px solid rgba(255,255,255,0.2);
        }


        .song:last-child {
            border-bottom: none;
        }


        .song-name {
            text-align: left;

            font-size: 15px;

            color: white;
        }


        .song button {
            color: white;

            background: transparent;

            border: none;

            font-size: 20px;

            cursor: pointer;

            transition: 0.2s;
        }


        .song button:hover {
            transform: scale(1.2);

            text-shadow: 0 0 10px white;
        }


        /* Trình phát nhạc */

        #music-player {
            width: 100%;

            margin-top: 20px;
        }


        /* =========================
           7. GIAO DIỆN ĐIỆN THOẠI
        ========================= */

        @media (max-width: 600px) {

            h1 {
                font-size: 32px;
            }

            .description {
                font-size: 16px;
            }

            .socials {
                gap: 10px;

                flex-wrap: wrap;
            }

            .socials a {
                padding: 10px 18px;
            }

            .music-section {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         VIDEO BACKGROUND
    ========================= -->

    <video autoplay muted loop playsinline id="bg-video">

        <source src="background.mp4" type="video/mp4">

        Trình duyệt của bạn không hỗ trợ video.

    </video>


    <!-- LỚP PHỦ TỐI -->

    <div class="overlay"></div>



    <!-- =========================
         NỘI DUNG WEBSITE
    ========================= -->

    <main class="content">


        <!-- GIỚI THIỆU -->

        <h1>Welcome to my world</h1>

        <p class="description">
            This is my personal website.
            <br>
            Welcome to my little world.
        </p>



        <!-- =========================
             MẠNG XÃ HỘI
        ========================= -->

        <div class="socials">

            <a
                href="https://www.instagram.com/YOUR_USERNAME/"
                target="_blank"
                rel="noopener noreferrer">

                Instagram

            </a>


            <a
                href="https://www.facebook.com/YOUR_USERNAME/"
                target="_blank"
                rel="noopener noreferrer">

                Facebook

            </a>

        </div>



        <!-- =========================
             FAVORITE MUSIC
        ========================= -->

        <button
            class="music-button"
            onclick="toggleMusic()">

            ♫ Favorite Music

        </button>



        <!-- DANH SÁCH BÀI HÁT -->

        <section
            class="music-section"
            id="music-section">


            <h2>My Favorite Music</h2>



            <!-- BÀI HÁT 1 -->

            <div class="song">

                <span class="song-name">
                    Song 1 — My favorite song
                </span>

                <button onclick="playSong(0)">
                    ▶
                </button>

            </div>



            <!-- BÀI HÁT 2 -->

            <div class="song">

                <span class="song-name">
                    Song 2 — Another favorite
                </span>

                <button onclick="playSong(1)">
                    ▶
                </button>

            </div>



            <!-- BÀI HÁT 3 -->

            <div class="song">

                <span class="song-name">
                    Song 3 — My playlist
                </span>

                <button onclick="playSong(2)">
                    ▶
                </button>

            </div>



            <!-- TRÌNH PHÁT NHẠC -->

            <audio
                id="music-player"
                controls>

                Trình duyệt không hỗ trợ phát nhạc.

            </audio>


        </section>


    </main>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        /* MỞ / ĐÓNG DANH SÁCH NHẠC */

        function toggleMusic() {

            const section =
                document.getElementById("music-section");


            if (
                section.style.display === "none" ||
                section.style.display === ""
            ) {

                section.style.display = "block";

            } else {

                section.style.display = "none";

            }

        }



        /* DANH SÁCH BÀI HÁT */

        const songs = [

            "music/song1.mp3",

            "music/song2.mp3",

            "music/song3.mp3"

        ];



        /* TRÌNH PHÁT NHẠC */

        const player =
            document.getElementById("music-player");



        /* PHÁT BÀI HÁT */

        function playSong(index) {

            player.src = songs[index];

            player.play().catch(function(error) {

                console.log("Không thể phát nhạc:", error);

            });

        }


    </script>


</body>

</html>
