
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Website</title>

  <style>
    /* =========================
       CÀI ĐẶT CHUNG
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --text-color: #ffffff;
      --panel-bg: rgba(255, 255, 255, 0.14);
      --panel-border: rgba(255, 255, 255, 0.3);
      --button-bg: rgba(255, 255, 255, 0.18);
      --button-hover: rgba(255, 255, 255, 0.3);
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text-color);
      background: #111;
      overflow-x: hidden;
      transition: color 0.4s ease;
    }

    /* =========================
       VIDEO BACKGROUND
    ========================= */

    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .video-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: -1;
      transition: background 0.4s ease;
    }

    /* =========================
       NÚT CHUYỂN SÁNG / TỐI
    ========================= */

    .theme-toggle {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 20;

      width: 48px;
      height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.85);
      color: #111;
      font-size: 22px;
      cursor: pointer;

      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .theme-toggle:hover {
      transform: rotate(15deg) scale(1.08);
    }

    /* =========================
       NỘI DUNG CHÍNH
    ========================= */

    .container {
      min-height: 100vh;
      width: 100%;
      padding: 100px 20px 50px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .profile-card {
      width: min(100%, 650px);
      padding: 42px 30px;
      border: 1px solid var(--panel-border);
      border-radius: 24px;

      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      box-shadow: var(--shadow);
      animation: fadeIn 1s ease;
      transition: background 0.4s ease, border 0.4s ease;
    }

    .welcome {
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.7;
      opacity: 0.9;
      margin-bottom: 28px;
    }

    /* =========================
       SOCIAL BUTTONS
    ========================= */

    .social-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 28px;
    }

    .social-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      min-width: 145px;
      padding: 12px 20px;

      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;

      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 30px;
      background: var(--button-bg);

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        color 0.25s ease;
    }

    .social-button:hover {
      transform: translateY(-4px);
      background: var(--button-hover);
    }

    .social-icon {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    /* =========================
       FAVORITE MUSIC
    ========================= */

    .music-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      padding: 13px 25px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 30px;

      background: var(--button-bg);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        color 0.25s ease;
    }

    .music-button:hover {
      transform: translateY(-3px);
      background: var(--button-hover);
    }

    .music-panel {
      display: none;
      width: 100%;
      margin-top: 24px;
      text-align: left;

      border: 1px solid var(--panel-border);
      border-radius: 18px;
      overflow: hidden;

      background: var(--panel-bg);
      transition: background 0.4s ease, border 0.4s ease;
    }

    .music-panel.show {
      display: block;
      animation: fadeIn 0.35s ease;
    }

    .music-heading {
      padding: 18px 20px;
      font-size: 16px;
      font-weight: 700;
      border-bottom: 1px solid var(--panel-border);
    }

    .song {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 20px;
      border-bottom: 1px solid var(--panel-border);
      transition: background 0.2s ease;
    }

    .song:last-child {
      border-bottom: none;
    }

    .song:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .song-cover {
      width: 44px;
      height: 44px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      font-size: 20px;
    }

    .song-info {
      flex: 1;
      min-width: 0;
    }

    .song-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .song-artist {
      font-size: 12px;
      opacity: 0.75;
    }

    .song-status {
      font-size: 12px;
      opacity: 0.7;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      opacity: 0.75;
    }

    /* =========================
       GIAO DIỆN TỐI
    ========================= */

    body.dark-mode {
      --text-color: #f2f2f2;
      --panel-bg: rgba(8, 8, 8, 0.72);
      --panel-border: rgba(255, 255, 255, 0.12);
      --button-bg: rgba(0, 0, 0, 0.72);
      --button-hover: rgba(35, 35, 35, 0.95);
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    body.dark-mode .video-overlay {
      background: rgba(0, 0, 0, 0.58);
    }

    body.dark-mode .social-button,
    body.dark-mode .music-button {
      color: #fff;
      border-color: #333;
    }

    body.dark-mode .song-cover {
      background: #252525;
    }

    /* =========================
       HIỆU ỨNG
    ========================= */

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       ĐIỆN THOẠI
    ========================= */

    @media (max-width: 600px) {
      .container {
        padding: 90px 15px 35px;
      }

      .profile-card {
        padding: 32px 18px;
        border-radius: 20px;
      }

      .subtitle {
        font-size: 14px;
      }

      .social-links {
        gap: 10px;
      }

      .social-button {
        min-width: 125px;
        padding: 11px 15px;
        font-size: 13px;
      }

      .music-button {
        padding: 12px 20px;
        font-size: 14px;
      }

      .theme-toggle {
        top: 15px;
        right: 15px;
        width: 44px;
        height: 44px;
      }

      .song {
        padding: 13px 14px;
      }
    }

    /* Tôn trọng cài đặt giảm chuyển động của thiết bị */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- VIDEO NỀN -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
  </video>

  <div class="video-overlay"></div>

  <!-- NÚT ĐỔI GIAO DIỆN -->
  <button
    id="theme-toggle"
    class="theme-toggle"
    aria-label="Chuyển sang giao diện tối"
    title="Đổi giao diện"
  >
    🌙
  </button>

  <!-- NỘI DUNG WEBSITE -->
  <main class="container">
    <section class="profile-card">

      <h1 class="welcome">Welcome to My Website</h1>

      <p class="subtitle">
        Xin chào! Đây là không gian cá nhân của mình.<br>
        Một chút về bản thân, sở thích và những điều mình yêu thích.
      </p>

      <!-- LIÊN KẾT MẠNG XÃ HỘI -->
      <div class="social-links">

        <a
          class="social-button"
          href="https://www.instagram.com/YOUR_USERNAME/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <!-- Instagram icon -->
          <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2.2A2.8 2.8 0 0 0 4.2 7v10A2.8 2.8 0 0 0 7 19.8h10a2.8 2.8 0 0 0 2.8-2.8V7A2.8 2.8 0 0 0 17 4.2H7zm5 2.3a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zm0 2.2a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6zm5.7-3.4a1.3 1.3 0 1 1 0 2.6 1.3 1.3 0 0 1 0-2.6z"/>
          </svg>
          Instagram
        </a>

        <a
          class="social-button"
          href="https://www.facebook.com/YOUR_USERNAME"
          target="_blank"
          rel="noopener noreferrer"
        >
          <!-- Facebook icon -->
          <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13.5 21v-8h2.7l.4-3.1h-3.1V8c0-.9.3-1.5 1.6-1.5h1.7V3.7c-.3 0-1.4-.1-2.6-.1-2.6 0-4.4 1.6-4.4 4.5v1.8H7V13h2.8v8h3.7z"/>
          </svg>
          Facebook
        </a>

      </div>

      <!-- FAVORITE MUSIC -->
      <button
        id="music-toggle"
        class="music-button"
        aria-expanded="false"
        aria-controls="music-panel"
      >
        ♫ Favorite Music
        <span id="music-arrow">＋</span>
      </button>

      <!-- DANH SÁCH BÀI HÁT MẪU -->
      <div id="music-panel" class="music-panel">

        <div class="music-heading">My Playlist</div>

        <div class="song">
          <div class="song-cover">♫</div>
          <div class="song-info">
            <div class="song-title">Song Title One</div>
            <div class="song-artist">Artist Name</div>
          </div>
          <div class="song-status">Coming soon</div>
        </div>

        <div class="song">
          <div class="song-cover">♪</div>
          <div class="song-info">
            <div class="song-title">Song Title Two</div>
            <div class="song-artist">Artist Name</div>
          </div>
          <div class="song-status">Coming soon</div>
        </div>

        <div class="song">
          <div class="song-cover">♫</div>
          <div class="song-info">
            <div class="song-title">Song Title Three</div>
            <div class="song-artist">Artist Name</div>
          </div>
          <div class="song-status">Coming soon</div>
        </div>

      </div>

      <div class="footer">
        Made with ♡
      </div>

    </section>
  </main>

  <script>
    // =========================
    // ĐỔI GIAO DIỆN SÁNG / TỐI
    // =========================

    const themeToggle = document.getElementById("theme-toggle");
    const bgVideo = document.getElementById("bg-video");
    const videoSource = bgVideo.querySelector("source");

    function setTheme(isDark) {
      document.body.classList.toggle("dark-mode", isDark);

      // Đổi biểu tượng và nội dung trợ năng
      themeToggle.textContent = isDark ? "☀️" : "🌙";

      themeToggle.setAttribute(
        "aria-label",
        isDark
          ? "Chuyển sang giao diện sáng"
          : "Chuyển sang giao diện tối"
      );

      // Đổi video nền
      const newVideo = isDark
        ? "background-dark.mp4"
        : "background.mp4";

      if (videoSource.getAttribute("src") !== newVideo) {
        videoSource.setAttribute("src", newVideo);
        bgVideo.load();

        bgVideo.play().catch(() => {
          // Một số trình duyệt có thể yêu cầu người dùng tương tác
        });
      }

      // Lưu lựa chọn của người dùng
      localStorage.setItem("theme", isDark ? "dark" : "light");
    }

    themeToggle.addEventListener("click", () => {
      const isDark = !document.body.classList.contains("dark-mode");
      setTheme(isDark);
    });

    // Khôi phục giao diện đã chọn lần trước
    const savedTheme = localStorage.getItem("theme");
    setTheme(savedTheme === "dark");


    // =========================
    // MỞ / ĐÓNG FAVORITE MUSIC
    // =========================

    const musicToggle = document.getElementById("music-toggle");
    const musicPanel = document.getElementById("music-panel");
    const musicArrow = document.getElementById("music-arrow");

    musicToggle.addEventListener("click", () => {
      const isOpen = musicPanel.classList.toggle("show");

      musicToggle.setAttribute("aria-expanded", isOpen);
      musicArrow.textContent = isOpen ? "－" : "＋";
    });
  </script>

</body>
</html>
